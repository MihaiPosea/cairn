<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cairn - {{.Root}}</title>
<style>
  :root {
    --paper:#F7F8F7; --surface:#fff; --surface-2:#EFF2F1; --ink:#141A19;
    --ink-soft:#4E5957; --rule:#DCE2E0; --accent:#146B62; --accent-soft:#E2EFEC;
    --warn:#8F5614; --crit:#A32B22; --pkg:#5B4A8A; --pkg-soft:#ECE7F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#101413; --surface:#171D1C; --surface-2:#1E2625; --ink:#E7ECEA;
      --ink-soft:#97A3A0; --rule:#2B3432; --accent:#5CC4B6; --accent-soft:#14302C;
      --warn:#D9A05B; --crit:#E88376; --pkg:#B3A3DE; --pkg-soft:#241F33;
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--paper); color:var(--ink); display:flex; flex-direction:column;
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header {
    display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--rule); background:var(--surface);
  }
  h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  .path { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink-soft); }
  .stats { display:flex; gap:18px; margin-left:auto; flex-wrap:wrap;
           font:12px ui-monospace,Menlo,monospace; color:var(--ink-soft); }
  .stats b { color:var(--ink); font-weight:600; }
  main { flex:1; display:flex; min-height:0; }
  #canvas { flex:1; position:relative; overflow:hidden; cursor:grab; }
  #canvas.drag { cursor:grabbing; }
  svg { width:100%; height:100%; display:block; }
  .edge { stroke:var(--rule); stroke-width:1; fill:none; }
  .edge.type-only { stroke-dasharray:3 3; }
  .edge.hot { stroke:var(--accent); stroke-width:1.8; }
  .node rect { fill:var(--surface); stroke:var(--rule); stroke-width:1.2; rx:3; }
  .node.package rect { fill:var(--pkg-soft); stroke:var(--pkg); }
  .node.entry rect { stroke:var(--accent); stroke-width:1.8; }
  .node.dead rect { fill:transparent; stroke:var(--crit); stroke-dasharray:4 3; }
  .node.sel rect { stroke:var(--accent); stroke-width:2.4; fill:var(--accent-soft); }
  .node.dim { opacity:.16; }
  .node text { font:11px ui-monospace,Menlo,monospace; fill:var(--ink); pointer-events:none; }
  .node { cursor:pointer; }
  aside {
    width:340px; border-left:1px solid var(--rule); background:var(--surface);
    padding:18px 20px; overflow:auto; flex-shrink:0;
  }
  aside h2 { font:600 13px/1.3 ui-sans-serif,sans-serif; margin:0 0 4px;
             word-break:break-all; letter-spacing:-0.01em; }
  .kind { font:11px ui-monospace,Menlo,monospace; color:var(--ink-soft);
          text-transform:uppercase; letter-spacing:.08em; }
  .row { display:flex; justify-content:space-between; padding:6px 0;
         border-bottom:1px solid var(--rule); font:12px ui-monospace,Menlo,monospace; }
  .row span:last-child { color:var(--ink); font-weight:600; }
  .row span:first-child { color:var(--ink-soft); }
  h3 { font:600 11px/1 ui-monospace,Menlo,monospace; text-transform:uppercase;
       letter-spacing:.08em; color:var(--ink-soft); margin:20px 0 8px; }
  ul { list-style:none; margin:0; padding:0; }
  li { font:12px ui-monospace,Menlo,monospace; padding:3px 0; color:var(--ink);
       cursor:pointer; word-break:break-all; }
  li:hover { color:var(--accent); }
  .note { background:var(--accent-soft); border-left:2px solid var(--accent);
          padding:8px 10px; margin:12px 0 0; font-size:12px; color:var(--ink-soft); }
  .note.bad { background:transparent; border-color:var(--crit); color:var(--crit); }
  .empty { color:var(--ink-soft); font-size:12px; }
  input {
    font:12px ui-monospace,Menlo,monospace; padding:5px 8px; border:1px solid var(--rule);
    border-radius:3px; background:var(--paper); color:var(--ink); width:180px;
  }
  .legend { display:flex; gap:14px; padding:8px 20px; border-top:1px solid var(--rule);
            background:var(--surface); font:11px ui-monospace,Menlo,monospace; color:var(--ink-soft); }
  .sw { display:inline-block; width:9px; height:9px; margin-right:5px; border:1.2px solid var(--rule); }
  .sw.entry { border-color:var(--accent); }
  .sw.dead { border-color:var(--crit); border-style:dashed; }
  .sw.pkg { border-color:var(--pkg); background:var(--pkg-soft); }
</style>
</head>
<body>
<header>
  <div>
    <h1>cairn</h1>
    <div class="path">{{.Root}}</div>
  </div>
  <input id="q" placeholder="filter files" autocomplete="off">
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="canvas"><svg id="svg"><g id="viewport"></g></svg></div>
  <aside id="panel"><p class="empty">Click any node.<br><br>Drag to pan, scroll to zoom.</p></aside>
</main>
<div class="legend">
  <span><i class="sw entry"></i>entry point</span>
  <span><i class="sw"></i>file</span>
  <span><i class="sw pkg"></i>package</span>
  <span><i class="sw dead"></i>nothing reaches it</span>
  <span id="trunc"></span>
</div>

<script>
const DATA = {{.Data}};

const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const out = new Map(), inc = new Map();
for (const e of DATA.edges) {
  if (!out.has(e.from)) out.set(e.from, []);
  if (!inc.has(e.to)) inc.set(e.to, []);
  out.get(e.from).push(e);
  inc.get(e.to).push(e);
}

const svg = document.getElementById('svg');
const vp = document.getElementById('viewport');
const NS = 'http://www.w3.org/2000/svg';
const W = 210, H = 20;

// Edges are drawn first so nodes sit on top of them.
const edgeEls = new Map();
for (const e of DATA.edges) {
  const a = byId.get(e.from), b = byId.get(e.to);
  if (!a || !b) continue;
  const p = document.createElementNS(NS, 'path');
  const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
  const mid = (x1 + x2) / 2;
  p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + mid + ',' + y1 + ' ' + mid + ',' + y2 + ' ' + x2 + ',' + y2);
  p.setAttribute('class', 'edge ' + e.kind);
  vp.appendChild(p);
  const key = e.from + ' ' + e.to;
  if (!edgeEls.has(key)) edgeEls.set(key, []);
  edgeEls.get(key).push(p);
}

const nodeEls = new Map();
for (const n of DATA.nodes) {
  const g = document.createElementNS(NS, 'g');
  let cls = 'node ' + n.kind;
  if (n.entry) cls += ' entry';
  if (n.dead) cls += ' dead';
  g.setAttribute('class', cls);
  g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');

  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('width', W); r.setAttribute('height', H);
  g.appendChild(r);

  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', 7); t.setAttribute('y', 14);
  t.textContent = n.label.length > 30 ? '...' + n.label.slice(-27) : n.label;
  g.appendChild(t);

  const title = document.createElementNS(NS, 'title');
  title.textContent = n.label;
  g.appendChild(title);

  g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  vp.appendChild(g);
  nodeEls.set(n.id, g);
}

let tx = 60, ty = 40, scale = 1;
function apply() { vp.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
apply();

const canvas = document.getElementById('canvas');
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.classList.add('drag'); });
addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; apply();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * f; ty = my - (my - ty) * f;
  scale = Math.max(0.05, Math.min(4, scale * f));
  apply();
}, { passive: false });
canvas.addEventListener('click', () => select(null));

// Everything that transitively depends on a node: its blast radius.
function upstream(id) {
  const seen = new Set([id]); const q = [id];
  while (q.length) {
    const cur = q.shift();
    for (const e of (inc.get(cur) || [])) {
      if (!seen.has(e.from)) { seen.add(e.from); q.push(e.from); }
    }
  }
  return seen;
}

function select(id) {
  for (const el of nodeEls.values()) el.classList.remove('sel', 'dim');
  for (const list of edgeEls.values()) for (const p of list) p.classList.remove('hot');

  if (!id) { renderPanel(null); return; }

  const hot = upstream(id);
  const direct = new Set((out.get(id) || []).map(e => e.to));
  for (const [nid, el] of nodeEls) {
    if (nid === id) el.classList.add('sel');
    else if (!hot.has(nid) && !direct.has(nid)) el.classList.add('dim');
  }
  for (const [key, list] of edgeEls) {
    const parts = key.split(' ');
    const from = parts[0], to = parts[1];
    if ((hot.has(from) && hot.has(to)) || from === id || to === id) {
      for (const p of list) p.classList.add('hot');
    }
  }
  renderPanel(byId.get(id));
}

function bytes(b) {
  if (!b) return null;
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + ' ' + u[i];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function renderPanel(n) {
  const panel = document.getElementById('panel');
  if (!n) {
    panel.innerHTML = '<p class="empty">Click any node.<br><br>Drag to pan, scroll to zoom.</p>';
    return;
  }
  const deps = out.get(n.id) || [];
  const dependents = inc.get(n.id) || [];
  const size = bytes(n.bytes);

  let html = '<div class="kind">' + esc(n.kind) + '</div><h2>' + esc(n.label) + '</h2>';
  html += '<div class="row"><span>breaks if changed</span><span>' + n.blast + '</span></div>';
  html += '<div class="row"><span>imports</span><span>' + deps.length + '</span></div>';
  html += '<div class="row"><span>imported by</span><span>' + dependents.length + '</span></div>';
  if (size) html += '<div class="row"><span>installed size</span><span>' + size + '</span></div>';
  if (n.note) html += '<div class="note' + (n.dead ? ' bad' : '') + '">' + esc(n.note) + '</div>';

  if (dependents.length) {
    html += '<h3>imported by</h3><ul>';
    for (const e of dependents.slice(0, 40)) {
      const t = byId.get(e.from);
      html += '<li data-go="' + esc(e.from) + '">' + esc(t ? t.label : e.from) + (e.line ? ':' + e.line : '') + '</li>';
    }
    html += '</ul>';
  }
  if (deps.length) {
    html += '<h3>imports</h3><ul>';
    for (const e of deps.slice(0, 40)) {
      const t = byId.get(e.to);
      html += '<li data-go="' + esc(e.to) + '">' + esc(t ? t.label : e.to) + '</li>';
    }
    html += '</ul>';
  }

  panel.innerHTML = html;
  for (const el of panel.querySelectorAll('[data-go]')) {
    el.addEventListener('click', () => select(el.getAttribute('data-go')));
  }
}

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  for (const [id, el] of nodeEls) {
    const n = byId.get(id);
    el.classList.toggle('dim', q !== '' && !n.label.toLowerCase().includes(q));
  }
});

const s = DATA.stats;
document.getElementById('stats').innerHTML = [
  ['files', s.files], ['imports', s.imports], ['packages', s.packages],
  ['unresolved', s.unresolved], ['cycles', s.cycles], ['unreachable', s.dead]
].map(p => '<span>' + p[0] + ' <b>' + p[1] + '</b></span>').join('');

if (DATA.truncated) {
  document.getElementById('trunc').textContent =
    'showing the ' + DATA.nodes.length + ' most-depended-on nodes, ' + DATA.truncated + ' not drawn';
}
</script>
</body>
</html>
