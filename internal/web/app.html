<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Alike&display=swap">
<title>cairn - {{.Root}}</title>
<style>
  /* Palette lifted from mihaiposea.com: warm stone paper, near-black ink,
     amber and brand blue as the only two accents. The site ships light only,
     so the dark variant is built from its own brand tokens - brand-black
     #0b0b0b, brand-white #f6f5f3, brand-grey #cdc7bd - rather than invented. */
  :root {
    --paper:#fafaf8; --surface:#ffffff; --surface-2:#f0efed; --surface-3:#ececea;
    --ink:#1c1917; --ink-2:#44403c; --ink-soft:#78716c; --ink-faint:#8a827c;
    --rule:#e7e5e4; --rule-strong:#d6d3d1;
    --accent:#0a17b6; --accent-soft:#e8eaf9; --accent-3:#006afe;
    --out:#0a17b6; --in:#d97706; --in-soft:#fdf3e3;
    --crit:#dc2626; --pkg:#57534e; --pkg-soft:#f5f5f4;
    --edge:#d6d3d1;
    --radius:10px; --radius-sm:6px;
    --font-sans:"Geist","Geist Fallback",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:"Geist Mono","Geist Mono Fallback",ui-monospace,SFMono-Regular,Menlo,monospace;
    --font-serif:"Alike",ui-serif,Georgia,"Times New Roman",serif;
  }
  /* The site ships light only, so light is the default here too. Dark is built
     from the same brand tokens - brand-black #0b0b0b, brand-white #f6f5f3,
     brand-grey #cdc7bd - rather than invented, and is opt-in. */
  :root[data-theme="dark"] {
      --paper:#0b0b0b; --surface:#141312; --surface-2:#1c1b19; --surface-3:#232120;
      --ink:#f6f5f3; --ink-2:#cdc7bd; --ink-soft:#9a938a; --ink-faint:#7d766e;
      --rule:#2a2724; --rule-strong:#3a3633;
      --accent:#7f92ff; --accent-soft:#181c33; --accent-3:#4d9bff;
      --out:#7f92ff; --in:#e0a45c; --in-soft:#2a2115;
      --crit:#f0736a; --pkg:#cdc7bd; --pkg-soft:#1c1b19;
    --edge:#332f2c;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column;
    font:14px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased;
    letter-spacing:-0.011em;
  }
  ::selection { background:rgba(135,206,250,.35); color:#6baed6; }

  header {
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:13px 22px; border-bottom:1px solid var(--rule); background:var(--surface);
    flex-shrink:0;
  }
  .brand {
    font-family:var(--font-serif); font-size:23px; line-height:1;
    letter-spacing:-0.05em; color:var(--ink);
  }
  .repo {
    font:12px var(--font-mono); color:var(--ink-faint);
    max-width:min(300px,20vw); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; direction:rtl;
  }
  .stats { display:flex; gap:18px; margin-left:auto; flex-wrap:wrap;
           font:12px var(--font-sans); color:var(--ink-soft); letter-spacing:0; }
  .stats b { color:var(--ink); font-weight:550; font-variant-numeric:tabular-nums; }
  .stats .warn b { color:var(--in); }

  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; overflow:hidden; cursor:grab; background:var(--paper); }
  #stage.drag { cursor:grabbing; }
  #c { display:block; position:absolute; inset:0; }
  #mini {
    position:absolute; right:16px; bottom:16px; width:198px; height:124px;
    border:1px solid var(--rule); background:var(--surface); cursor:pointer;
    border-radius:var(--radius-sm); box-shadow:0 1px 3px rgba(28,25,23,.06);
  }

  aside {
    width:clamp(250px,25vw,360px); border-left:1px solid var(--rule);
    background:var(--surface); padding:18px 20px 40px; overflow:auto; flex-shrink:0;
  }
  aside h2 { font:550 17px/1.25 var(--font-sans); letter-spacing:-0.03em;
             margin:2px 0 3px; word-break:break-all; color:var(--ink); }
  .dir { font:11px var(--font-mono); color:var(--ink-faint); word-break:break-all; margin-bottom:14px; }
  .kind { font:11px var(--font-sans); color:var(--ink-faint); letter-spacing:0.02em; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding:7px 0;
         border-bottom:1px solid var(--rule); font:13px var(--font-sans); }
  .row span:first-child { color:var(--ink-soft); }
  .row span:last-child { color:var(--ink); font-weight:550; font-variant-numeric:tabular-nums; }
  h3 { font:550 11px/1 var(--font-sans); letter-spacing:0.04em; text-transform:uppercase;
       color:var(--ink-faint); margin:22px 0 8px; }
  h3 .k { display:inline-block; width:7px; height:7px; border-radius:2px;
          margin-right:6px; vertical-align:0px; }
  h3 .k.in { background:var(--in); } h3 .k.out { background:var(--out); }
  ul { list-style:none; margin:0; padding:0; }
  li { font:12.5px var(--font-sans); padding:5px 0; color:var(--ink-2);
       cursor:pointer; word-break:break-all; border-bottom:1px solid var(--rule); }
  li:hover { color:var(--accent); }
  li .d { color:var(--ink-faint); font-size:11px; }

  .imp { padding:8px 0; border-bottom:1px solid var(--rule); cursor:pointer; }
  .imp:hover .who { color:var(--accent); }
  .imp .who { font:12.5px var(--font-sans); color:var(--ink-2); display:block; }
  .imp .who .d { color:var(--ink-faint); font-size:11px; }
  .imp code {
    display:block; font:11px/1.55 var(--font-mono); color:var(--ink-2);
    background:var(--surface-2); padding:6px 9px; margin-top:6px;
    border-radius:var(--radius-sm); white-space:pre; overflow-x:auto;
    border-left:2px solid var(--rule-strong);
  }
  .imp:hover code { background:var(--surface-3); }
  .imp.in code { border-left-color:var(--in); }
  .imp.out code { border-left-color:var(--out); }
  .imp .ln { color:var(--ink-faint); font:11px var(--font-mono); float:right; }

  .note { background:var(--accent-soft); border-left:2px solid var(--accent);
          padding:9px 11px; margin:12px 0 0; font-size:12.5px; color:var(--ink-2);
          border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
  .note.bad { background:transparent; border-color:var(--crit); color:var(--crit); }
  .empty { color:var(--ink-soft); font-size:13px; }
  .empty b { color:var(--ink); display:block; margin-bottom:8px;
             font:550 15px/1.3 var(--font-sans); letter-spacing:-0.02em; }

  input, button {
    font:12.5px var(--font-sans); padding:6px 11px; border:1px solid var(--rule-strong);
    border-radius:var(--radius-sm); background:var(--surface); color:var(--ink);
  }
  input { width:190px; }
  input::placeholder { color:var(--ink-faint); }
  input:focus { outline:none; border-color:var(--accent); }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }

  .tabs { margin-left:auto; display:flex; gap:2px; background:var(--surface-2);
          padding:2px; border-radius:var(--radius-sm); border:1px solid var(--rule); }
  .tab { font:12px var(--font-sans); padding:4px 13px; border:none; background:none;
         color:var(--ink-soft); border-radius:5px; letter-spacing:-0.01em; }
  .tab.on { background:var(--surface); color:var(--ink); font-weight:500;
            box-shadow:0 1px 2px rgba(28,25,23,.07); }
  .tab:hover { color:var(--accent); border-color:transparent; }

  #report {
    display:none; flex:1; overflow-y:auto; background:var(--paper);
    padding:44px 0 90px;
  }
  body.report #report { display:block; }
  body.report main, body.report #chips, body.report .legend { display:none !important; }
  .rp { max-width:760px; margin:0 auto; padding:0 28px; }
  .rp h1 { font:400 42px/1.1 var(--font-serif); letter-spacing:-0.045em;
           color:var(--ink); margin:0 0 10px; }
  .rp .lede { font:15.5px/1.6 var(--font-sans); color:var(--ink-2); margin:0 0 34px; }
  .rp h2 { font:550 13px/1 var(--font-sans); letter-spacing:0.05em; text-transform:uppercase;
           color:var(--ink-faint); margin:40px 0 4px; padding-top:18px;
           border-top:1px solid var(--rule); }
  .rp .sub { font:13px/1.55 var(--font-sans); color:var(--ink-soft); margin:0 0 16px; }
  .rp .none { font:13px var(--font-mono); color:var(--ink-faint); padding:8px 0; }
  .f { display:block; width:100%; text-align:left; background:none; border:none;
       border-bottom:1px solid var(--rule); padding:11px 4px; }
  .f:hover { background:var(--surface-2); border-color:var(--rule-strong); }
  .f .ft { font:13px var(--font-mono); color:var(--ink); }
  .f .fn { float:right; font:12px var(--font-mono); color:var(--ink-faint);
           font-variant-numeric:tabular-nums; }
  .f .fd { display:block; font:12.5px/1.5 var(--font-sans); color:var(--ink-soft); margin-top:3px; }
  .f.crit { border-left:2px solid var(--crit); padding-left:10px; }
  .f.warn { border-left:2px solid var(--in); padding-left:10px; }
  .num { display:flex; gap:34px; flex-wrap:wrap; margin:0 0 6px; }
  .num div { }
  .num b { display:block; font:400 27px/1.15 var(--font-serif); color:var(--ink);
           font-variant-numeric:tabular-nums; letter-spacing:-0.03em; }
  .num span { font:11.5px var(--font-sans); color:var(--ink-faint); }

  #chips {
    display:flex; gap:4px; align-items:center; flex-wrap:wrap;
    padding:9px 22px; border-bottom:1px solid var(--rule); background:var(--surface-2);
    flex-shrink:0;
  }
  .crumb {
    font:12px var(--font-mono); padding:3px 8px; border:1px solid transparent;
    border-radius:var(--radius-sm); background:none; color:var(--ink-2);
  }
  .crumb:last-of-type { color:var(--ink); font-weight:500; }
  .crumb:hover { background:var(--surface); border-color:var(--rule-strong); color:var(--accent); }
  #chips .sep { color:var(--ink-faint); font:12px var(--font-mono); }
  .crumb-count { margin-left:auto; font:11.5px var(--font-mono); color:var(--ink-faint); }

  .rail {
    width:clamp(148px,13vw,196px); flex-shrink:0; overflow-y:auto;
    background:var(--surface); padding:14px 12px 30px;
  }
  #rail-in  { border-right:1px solid var(--rule); }
  #rail-out { border-left:1px solid var(--rule); }
  .rail h4 { font:550 10.5px/1 var(--font-sans); letter-spacing:0.06em;
             text-transform:uppercase; color:var(--ink-faint); margin:0 0 9px 4px; }
  .rail-none { font:11.5px var(--font-mono); color:var(--ink-faint); margin:0 0 0 4px; }
  .rail-item {
    display:flex; width:100%; gap:6px; align-items:baseline; text-align:left;
    font:11.5px var(--font-mono); padding:4px 5px; margin-bottom:1px;
    border:none; border-left:2px solid var(--in); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    background:none; color:var(--ink-2);
  }
  .rail-item.out { border-left-color:var(--out); }
  .rail-item:hover { background:var(--surface-2); color:var(--accent); }
  .rail-item .rl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-item .rn { margin-left:auto; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .rail-item.dim { opacity:0.34; }
  .rail-item.hot { background:var(--surface-2); color:var(--ink); font-weight:500; }
  .chips-label { font:11px var(--font-sans); color:var(--ink-faint);
                 letter-spacing:0.04em; text-transform:uppercase; margin-right:3px; }
  .chip {
    font:11.5px var(--font-mono); padding:4px 9px; border:1px solid var(--rule-strong);
    border-radius:999px; background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.alt { border-style:dashed; }

  .legend { display:flex; gap:16px; padding:9px 22px; border-top:1px solid var(--rule);
            background:var(--surface); font:11.5px var(--font-sans);
            color:var(--ink-faint); flex-shrink:0; align-items:center; }
  .sw { display:inline-block; width:9px; height:9px; margin-right:6px;
        border:1.2px solid var(--rule-strong); border-radius:2px; vertical-align:-1px; }
  .sw.entry { border-color:var(--rule-strong); box-shadow:inset 2px 0 0 var(--accent); }
  .sw.dead { border-color:var(--crit); border-style:dashed; }
  .sw.pkg { border-color:var(--pkg); background:var(--pkg-soft); }
  .hint { margin-left:auto; }

  #code {
    position:absolute; inset:0 0 0 auto; width:min(780px,62vw); z-index:5;
    background:var(--surface); border-left:1px solid var(--rule);
    display:none; flex-direction:column; box-shadow:-20px 0 50px rgba(28,25,23,.14);
  }
  #code.on { display:flex; }
  #code header {
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--rule); background:var(--surface-2);
  }
  #code .path { font:11.5px var(--font-mono); color:var(--ink-soft);
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #code .body { flex:1; overflow:auto; padding:10px 0 48px; }
  #code table { border-collapse:collapse; width:100%; font:12px/1.65 var(--font-mono); }
  #code td { padding:0 14px; vertical-align:top; white-space:pre; color:var(--ink-2); }
  #code td.n { text-align:right; color:var(--ink-faint); user-select:none; width:1%;
               border-right:1px solid var(--rule); font-variant-numeric:tabular-nums; }
  #code tr.hit { background:var(--in-soft); }
  #code tr.hit td.n { color:var(--in); font-weight:600; }
  #code tr.here { background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent); }
</style>
</head>
<body>
<header>
  <span class="brand">cairn</span>
  <span class="repo" id="repo" title="{{.Root}}">{{.Root}}</span>
  <input id="q" placeholder="filter" autocomplete="off">
  <button id="fit">fit</button>
  <button id="theme" title="light / dark">◐</button>
  <div class="tabs">
    <button class="tab on" data-tab="graph">graph</button>
    <button class="tab" data-tab="report">report</button>
  </div>
</header>
<div id="chips"></div>
<main>
  <div class="rail" id="rail-in"></div>
  <div id="stage"><canvas id="c"></canvas><canvas id="mini"></canvas>
    <div id="code"><header><button class="chip" id="codeclose">✕ close</button>
      <span class="path" id="codepath"></span></header>
      <div class="body" id="codebody"></div></div>
  </div>
  <div class="rail" id="rail-out"></div>
  <aside id="panel"></aside>
</main>
<div id="report"><div class="rp" id="rpbody"></div></div>
<div class="legend">
  <span><i class="sw entry"></i>entry point</span>
  <span><i class="sw"></i>file</span>
  <span><i class="sw pkg"></i>package</span>
  <span><i class="sw dead"></i>nothing reaches it</span>
  <span class="hint" id="hint">click a folder to go in · breadcrumb to come back · f fit</span>
</div>

<script>
const DATA = {{.Data}};

// ── model ───────────────────────────────────────────────────────────────────
//
// A repository has thousands of files and nobody can read a picture of all of
// them. So the graph is drawn at whatever level of the directory tree the
// reader has opened. A closed folder is one box with a count; an open folder is
// a container drawn around its contents, so you can see where you are without
// reading a breadcrumb.

const NW = 236, NH = 24, HGAP = 34, VGAP = 12;
// Below this many unconnected children it is not worth hiding them; they cost
// less on screen than the box explaining where they went.
const QUIET_MIN = 12;
// A module view is a handful of boxes, and at the file-level sizes it sat as a
// thin band across the middle of the window with the zoom pinned by its width.
// Taller boxes and more air between them give the level an aspect closer to
// the screen's, so the picture fills what it was given.
let ROOMY = false;
function boxH() { return ROOMY ? 34 : NH; }
function gapV() { return ROOMY ? 22 : VGAP; }
// Past this many lines a level stops being a picture of anything. Excalidraw's
// components/ holds 362, and 362 strokes say strictly less than none plus a
// sentence saying how many there are. Selection still draws its own.
const EDGE_LIMIT = 120;
const PAD = 16, HEADER = 26;      // container padding and title bar
const LAYER_GAP = 72;

const files = DATA.nodes;
const byId = new Map(files.map(n => [n.id, n]));

for (const n of files) {
  const i = n.label.lastIndexOf('/');
  n.base = i < 0 ? n.label : n.label.slice(i + 1);
  n.dir = i < 0 ? '' : n.label.slice(0, i + 1);
  n.segs = n.kind === 'package'
    ? (n.label.startsWith('@') ? [n.label.split('/')[0], n.label] : [n.label])
    : n.label.split('/');
}

// ── the directory tree ──────────────────────────────────────────────────────
const groups = new Map();

function groupFor(segs) {
  const id = 'g:' + segs.join('/');
  let g = groups.get(id);
  if (!g) {
    g = { id, group: true, base: segs[segs.length - 1] + '/', label: segs.join('/') + '/',
          dir: segs.length > 1 ? segs.slice(0, -1).join('/') + '/' : '',
          segs, kidIds: new Set(), leaves: [], count: 0, deadCount: 0,
          blast: 0, depth: Infinity, kind: 'group', entry: false, dead: false,
          parent: segs.length > 1 ? 'g:' + segs.slice(0, -1).join('/') : null };
    groups.set(id, g);
    if (g.parent) groupFor(segs.slice(0, -1)).kidIds.add(id);
  }
  return g;
}

for (const n of files) {
  const dirs = n.segs.slice(0, -1);
  n.parent = dirs.length ? 'g:' + dirs.join('/') : null;
  for (let k = 1; k <= dirs.length; k++) {
    const g = groupFor(dirs.slice(0, k));
    g.count++;
    g.blast = Math.max(g.blast, n.blast);
    g.depth = Math.min(g.depth, n.depth);
    g.deadCount += n.dead ? 1 : 0;
    if (n.entry) g.entry = true;
    if (k === dirs.length) g.leaves.push(n.id);
  }
}
for (const g of groups.values()) {
  if (!isFinite(g.depth)) g.depth = 0;
  // A folder is unreachable only when everything in it is; marking it on any
  // single dead child painted most of a monorepo red.
  g.dead = g.count > 0 && g.deadCount === g.count;
}

const rootIds = [];
for (const g of groups.values()) if (!g.parent) rootIds.push(g.id);
for (const n of files) if (!n.parent) rootIds.push(n.id);

function item(id) { return groups.get(id) || byId.get(id); }
function childIds(g) { return [...g.kidIds, ...g.leaves]; }

// Where to open.
//
// Not the literal repository root. That is usually scaffolding: excalidraw's
// is dev-docs/, examples/, public/, scripts/ and one box holding 91% of the
// code — a tidy picture that says nothing about the program. The architecture
// is one or two levels in, and the reader should not have to go looking for
// it. Vue's is packages/: reactivity at the base, runtime-core and shared in
// the middle, vue on top.
//
// So descend while the level is really just one box, and stop as soon as the
// split says something. The breadcrumb still shows the whole path, so nothing
// is hidden — it is a starting point, not a restriction.
function openingFocus() {
  const at = f => { const save = focus; focus = f; const k = scopeChildren(); focus = save; return k; };
  let f = [];
  for (let i = 0; i < 4; i++) {
    const kids = at(f);
    if (!kids.length) break;
    const total = kids.reduce((n, k) => n + (k.count || 1), 0);
    let big = null;
    for (const k of kids) {
      if (!k.group || k.synthetic || !k.segs || !k.segs.length) continue;
      if (!big || (k.count || 0) > (big.count || 0)) big = k;
    }
    if (!big) break;
    // Informative: more than a couple of boxes, and no one of them is most of
    // what is here.
    if (kids.length >= 3 && (big.count || 0) < total * 0.6) break;
    // But not at the price of a level nobody can read.
    const next = at(big.segs);
    if (next.length > 14 || next.length === 0) break;
    f = big.segs.slice();
  }
  return f;
}

// ── scope ──────────────────────────────────────────────────────────────────
//
// The reader is always inside exactly one container, and only its immediate
// children are drawn. Everything else — however much of it there is — is not
// on the screen at all.
//
// The previous model was an open set: folders could be expanded anywhere, and
// the whole repository stayed laid out around whatever was open. Drilling in
// added detail and never removed any. On excalidraw the default view was 66
// boxes and 301 edges; opening five nested folders reached 268 boxes and 1,159
// edges across a canvas 15,084 pixels wide. Someone who opened a folder to
// read four files got 1,159 lines across the screen.
//
// Scoping is what puts a ceiling on the picture. It costs the containers that
// used to show where you were, so a breadcrumb does that job now.

let focus = [];                       // path segments; [] is the repository

function focusPath() { return focus.length ? focus.join('/') + '/' : ''; }
function focusItem() { return focus.length ? groupFor(focus) : null; }

// The module a node belongs to, for the root scope.
const moduleOf = DATA.moduleOf || {};
function moduleIdOf(nodeId) {
  const m = moduleOf[nodeId];
  if (m) return m;
  // Older payloads, and any node the Go side did not place: fall back to the
  // top of its own path so the node is still drawn somewhere.
  const x = item(nodeId);
  if (!x) return null;
  return x.segs.length > 1 ? 'g:' + x.segs[0] : nodeId;
}

// The child of scope `f` that contains `node`, or null when the node is
// outside that scope entirely. This is the function the whole view rests on:
// every edge is classified by it, so a wrong answer here silently moves or
// drops connections.
function childAt(nodeId, f) {
  if (f.length === 0) return moduleIdOf(nodeId);
  const x = item(nodeId);
  if (!x) return null;
  const segs = x.segs;
  // Packages are not path-segmented the way files are: "@scope/pkg" is two
  // segments but "react-dom/client" is one segment containing a slash. Always
  // read segs, never label.split('/').
  if (segs.length <= f.length) return null;
  for (let i = 0; i < f.length; i++) if (segs[i] !== f[i]) return null;
  if (segs.length === f.length + 1) return nodeId;
  return 'g:' + segs.slice(0, f.length + 1).join('/');
}

let childMemo = new Map();
function childOf(nodeId) {
  let v = childMemo.get(nodeId);
  if (v === undefined) { v = childAt(nodeId, focus); childMemo.set(nodeId, v); }
  return v;
}

// Where an out-of-scope endpoint lives: walk up until it becomes something the
// reader could see, so a sibling folder shows as itself and anything further
// away shows as its module.
let railMemo = new Map();
function railRep(nodeId) {
  let v = railMemo.get(nodeId);
  if (v !== undefined) return v;
  v = null;
  for (let k = focus.length - 1; k >= 0; k--) {
    const f = focus.slice(0, k);
    const id = childAt(nodeId, f);
    if (id) { v = { focus: f, id }; break; }
  }
  railMemo.set(nodeId, v);
  return v;
}

// A box for a module that is not a directory.
const synthetic = new Map();
function synthModule(m) {
  let x = synthetic.get(m.id);
  if (!x) {
    x = { id: m.id, group: false, synthetic: true, kind: 'group',
          base: m.name, label: m.path || m.name, dir: '', segs: [m.id],
          count: m.files, leaves: [], kidIds: new Set(),
          blast: 0, depth: 0, ldepth: 0, entry: false, dead: false };
    synthetic.set(m.id, x);
    groups.set(m.id, x);   // so item() finds it everywhere else too
  }
  return x;
}

// The boxes of the current scope. At the root these are the modules the Go
// side computed; deeper down they are the immediate children of the focus.
function scopeChildren() {
  if (focus.length === 0) {
    if (DATA.modules && DATA.modules.length) {
      const out = [];
      for (const m of DATA.modules) {
        let x = item(m.id);
        if (!x) {
          // Modules with no directory behind them: the repository-root files,
          // the merged tail, external packages. Dropping them would leave
          // their files with no box to appear in, and every edge touching one
          // would vanish from the picture without being counted anywhere.
          x = synthModule(m);
        }
        x.moduleName = m.name; x.moduleKind = m.kind;
        out.push(x);
      }
      if (out.length) return out;
    }
    // No module map in the payload: the two halves land independently.
    return rootIds.map(item).filter(x => x && !(x.group && x.count === 0));
  }
  const f = focusItem();
  return f ? childIds(f).map(item).filter(Boolean) : [];
}

// ── layout ──────────────────────────────────────────────────────────────────
// Sizes are computed bottom-up so a container can be as big as its contents,
// then positions are assigned top-down.

let view = { boxes: [], edges: [], width: 0, height: 0, index: new Map() };

// Nothing nests any more: a box is a leaf or a collapsed folder, never a
// container drawn around its contents.
function isOpen() { return false; }

// The part of a file's directory the reader cannot already see.
//
// Inside an open packages/excalidraw/ every box was captioned
// "packages/excalidraw/" — sixty repetitions of the folder heading directly
// above them. It is the definition of information overload, and it was setting
// the width of every column in the graph.
function dirSuffix(x) {
  if (!x.dir || x.group) return '';
  // Relative to the scope the reader is already inside. Without this every
  // box inside packages/excalidraw/ is captioned "packages/excalidraw/" — the
  // breadcrumb directly above it, repeated for every box — and because the
  // caption has to fit, it sets the width of every column.
  const f = focusPath();
  if (f && x.dir.startsWith(f)) return x.dir.slice(f.length);
  return x.dir;
}

const MINW = 118;
function leafWidth(x) {
  ctx.font = '12px "Geist Mono", ui-monospace, Menlo, monospace';
  const suffix = dirSuffix(x);
  const w = ctx.measureText(x.base).width + (suffix ? ctx.measureText(suffix).width + 7 : 0);
  return Math.max(MINW, Math.min(NW, Math.ceil(w) + 18));
}

function measureBox(x) { x.bw = x.group ? NW : leafWidth(x); x.bh = boxH(); }

// Pack a set of laid-out boxes into layers by depth, wrapping tall columns.
function packChildren(kids) {
  if (!kids.length) return { w: 0, h: 0, cols: [] };

  const byLayer = new Map();
  for (const k of kids) {
    const d = k.ldepth || 0;
    (byLayer.get(d) || byLayer.set(d, []).get(d)).push(k);
  }
  const depths = [...byLayer.keys()].sort((a, b) => a - b);
  for (const d of depths) byLayer.get(d).sort((a, b) => a.label.localeCompare(b.label));

  // Wrap so a layer is never much taller than it is wide.
  const total = kids.reduce((s, k) => s + k.bh + gapV(), 0);
  const cap = Math.max(NH * 6, Math.sqrt(total * (NW + HGAP)) * 0.9);

  let x = 0, maxH = 0;
  const cols = [];
  for (const d of depths) {
    const spanStart = x;
    let colTop = 0, colW = 0, colX = x;
    for (const k of byLayer.get(d)) {
      if (colTop > 0 && colTop + k.bh > cap) {   // start a new sub-column
        x = colX + colW + HGAP;
        colX = x; colTop = 0; colW = 0;
      }
      k.rx = colX; k.ry = colTop;
      colTop += k.bh + gapV();
      colW = Math.max(colW, k.bw);
      maxH = Math.max(maxH, colTop - gapV());
    }
    x = colX + colW + LAYER_GAP;
    cols.push({ depth: d, x: spanStart, w: colX + colW - spanStart, n: byLayer.get(d).length });
  }
  return { w: Math.max(0, x - LAYER_GAP), h: maxH, cols };
}

// The numbered columns along the top.
//
// These used to come from the top-level packing, which knows only about the
// nine root folders — one head, labelled "1", stretched across the whole
// graph. The columns a reader actually sees are produced by the nested packing
// inside every open folder, and that result was thrown away.
//
// So derive them from where the boxes finally landed. Every box at the same x
// is one column, and x is monotonic in dependency depth (checked on excalidraw:
// 136 depth pairs, zero inversions), so numbering the columns left to right
// numbers them in dependency order — which is the whole point of the label.
function columnsOf(boxes) {
  const at = new Map();
  for (const b of boxes) {
    // An open folder is a backdrop spanning all its children, not a column of
    // its own — counting it produced a "column" 5,768px wide.
    if (isOpen(b)) continue;
    const x = Math.round(b.x);
    const c = at.get(x);
    if (c) { c.n++; c.w = Math.max(c.w, b.bw); c.depth = Math.min(c.depth, b.ldepth); }
    else at.set(x, { x, w: b.bw, n: 1, depth: b.ldepth });
  }
  return [...at.values()].sort((a, b) => a.x - b.x);
}

// Depth within the current scope.
//
// A folder's global depth is the minimum over everything inside it, so at the
// root — where every module contains something shallow — every box lands in
// column one and the numbered axis says nothing. Recomputing over just the
// boxes on screen is cheap because there are at most a few dozen, and it makes
// the column numbers true again: column 1 really is "nothing here imports
// these".
//
// Longest path, bounded, then compacted to consecutive ranks — the same
// algorithm and the same two reasons as internal/web/layout.go.
function localDepths(kids, edges) {
  for (const k of kids) k.ldepth = 0;
  const idx = new Map(kids.map(k => [k.id, k]));
  for (let pass = 0; pass < 64; pass++) {
    let changed = false;
    for (const e of edges) {
      const a = idx.get(e.from), b = idx.get(e.to);
      if (!a || !b) continue;
      if (a.ldepth + 1 > b.ldepth) { b.ldepth = a.ldepth + 1; changed = true; }
    }
    if (!changed) break;
  }
  const seen = [...new Set(kids.map(k => k.ldepth))].sort((a, b) => a - b);
  const rank = new Map(seen.map((d, i) => [d, i]));
  for (const k of kids) k.ldepth = rank.get(k.ldepth);
}

function relayout() {
  let kids = scopeChildren();
  childMemo = new Map();
  railMemo = new Map();

  // One pass over every edge, classified by where each end sits relative to
  // the scope. The five buckets are counted rather than inferred so the sum
  // can be checked against the edge total — an edge that silently belongs to
  // no bucket is a connection the reader never learns about.
  const agg = new Map();
  const cross = new Map();
  const audit = { inside: 0, self: 0, railIn: 0, railOut: 0, outside: 0 };
  const crossOf = id => {
    let c = cross.get(id);
    if (!c) { c = { in: new Map(), out: new Map() }; cross.set(id, c); }
    return c;
  };
  const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);

  for (const e of DATA.edges) {
    const a = childOf(e.from), b = childOf(e.to);
    if (a && b) {
      if (a === b) { audit.self++; continue; }
      audit.inside++;
      const k = a + ' ' + b;
      const cur = agg.get(k);
      if (cur) cur.n++; else agg.set(k, { from: a, to: b, n: 1 });
    } else if (a) {
      audit.railOut++;
      const r = railRep(e.to);
      if (r) bump(crossOf(a).out, r.id);
    } else if (b) {
      audit.railIn++;
      const r = railRep(e.from);
      if (r) bump(crossOf(b).in, r.id);
    } else {
      audit.outside++;
    }
  }

  let edges = [...agg.values()];

  // Fold away the children nothing here connects to.
  //
  // Scoping bounds the lines but not the boxes: a directory of test fixtures
  // can hold hundreds of files with not one edge between them.
  // svelte/tests/runtime-legacy/samples/ is 1,209 such boxes and
  // apps/v4/examples/base/ is 513, both with zero internal edges. Drawn
  // individually they are a wall; as one box they are a fact.
  const touched = new Set();
  for (const e of edges) { touched.add(e.from); touched.add(e.to); }
  const quiet = kids.filter(k => !touched.has(k.id));
  let quietBox = null;
  if (quiet.length >= QUIET_MIN && quiet.length > kids.length * 0.5) {
    kids = kids.filter(k => touched.has(k.id));
    const nFiles = quiet.reduce((n, k) => n + (k.group ? k.count : 1), 0);
    quietBox = {
      id: 'q:' + focus.join('/'), group: false, quiet: true, kind: 'quiet',
      base: quiet.length + ' unconnected', label: '', dir: '', segs: focus.concat('\x00quiet'),
      count: nFiles, blast: 0, depth: 0, ldepth: 0, entry: false, dead: false,
      note: nFiles + ' files, nothing here depends on them',
    };
    kids.push(quietBox);
  }

  ROOMY = kids.length <= 16;
  localDepths(kids, edges);
  for (const k of kids) measureBox(k);
  const b = packChildren(kids);
  for (const k of kids) { k.x = k.rx; k.y = k.ry; k.text = undefined; }

  // Line weight is relative to what is on screen. Fixed thresholds were tuned
  // for file-to-file counts; module aggregates run into the hundreds, so every
  // line saturated into the heaviest bucket and the weight stopped meaning
  // anything.
  const ns = edges.map(e => e.n).sort((x, y) => x - y);
  const q = f => ns.length ? ns[Math.min(ns.length - 1, Math.floor(ns.length * f))] : 1;
  const wt = [Math.max(2, q(0.6)), Math.max(4, q(0.9))];

  const dense = edges.length > EDGE_LIMIT;
  view = { focus: focus.slice(), boxes: kids, edges, dense, quiet: quietBox, width: b.w, height: b.h,
           layers: columnsOf(kids), index: new Map(kids.map(x => [x.id, x])),
           cross, audit, wt, rails: buildRails(cross) };

  renderCrumbs();
  renderRails();
}

// Rails collect everything that crosses the boundary, so a connection leaving
// the scope is shown rather than dropped.
function buildRails(cross) {
  const inc = new Map(), out = new Map();
  const add = (m, k, n) => m.set(k, (m.get(k) || 0) + n);
  for (const c of cross.values()) {
    for (const [k, n] of c.in) add(inc, k, n);
    for (const [k, n] of c.out) add(out, k, n);
  }
  const shape = m => [...m.entries()]
    .map(([id, n]) => {
      const x = item(id);
      return { id, n, label: x ? (x.moduleName || x.base || x.label) : id.replace(/^g:/, '') };
    })
    .sort((a, b) => b.n - a.n);
  return { in: shape(inc), out: shape(out) };
}

// ── canvas ──────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');

let dpr = 1, VW = 0, VH = 0, tx = 0, ty = 0, s = 1;
let selected = null, hovered = null, hotSet = null, filter = '';
let C = {};

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function readColors() {
  C = { paper: css('--paper'), surface: css('--surface'), surface2: css('--surface-2'),
        surface3: css('--surface-3'),
        ink: css('--ink'), ink2: css('--ink-2'), inkSoft: css('--ink-soft'),
        inkFaint: css('--ink-faint'), rule: css('--rule'), ruleStrong: css('--rule-strong'),
        accent: css('--accent'), accentSoft: css('--accent-soft'), crit: css('--crit'),
        pkg: css('--pkg'), pkgSoft: css('--pkg-soft'), edge: css('--edge'),
        out: css('--out'), in: css('--in') };
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect();
  VW = r.width; VH = r.height;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  const mr = mini.getBoundingClientRect();
  mini.width = Math.round(mr.width * dpr); mini.height = Math.round(mr.height * dpr);
  draw();
}

// ── camera, with easing ─────────────────────────────────────────────────────
// Jumping the viewport makes it impossible to keep your place. Every
// programmatic move is eased so the eye can follow it.
let anim = null;
function moveTo(nx, ny, ns, ms = 320) {
  const from = { tx, ty, s }, to = { tx: nx, ty: ny, s: ns };
  const t0 = performance.now();
  anim = () => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    tx = from.tx + (to.tx - from.tx) * e;
    ty = from.ty + (to.ty - from.ty) * e;
    s = from.s + (to.s - from.s) * e;
    if (k >= 1) anim = null;
    draw();
  };
  draw();
}

// Show the whole graph when it can be shown legibly; otherwise fill the height
// and let the reader pan sideways.
//
// Deciding on the aspect ratio alone was wrong: it fit a 2,700x590 layout to
// the height, clamped the zoom, and left the graph twice as wide as the window
// when it would have fitted entirely at a perfectly readable 0.52. The question
// is not "is it wide" but "would fitting it be too small to read".
// Below this zoom the 12px labels render under about 8 device pixels, which is
// present but not readable. Fitting a graph that ends up smaller than this
// trades the only thing the picture is for.
const READABLE = 0.62;

function fitParams() {
  const HEAD = 46;   // room for the column numbers above the graph
  const w = Math.max(view.width, 1) + 24, h = Math.max(view.height, 1) + 24 + HEAD, pad = 30;
  const both = Math.min((VW - pad * 2) / w, (VH - pad * 2) / h);
  let ns = both >= READABLE ? both : Math.max(READABLE, (VH - pad * 2) / h);
  // The old ceiling was set when the whole repository was on screen at once.
  // A module view is seven boxes, and holding it at 1.1 leaves most of the
  // window empty around a small diagram — the zoom should follow how much
  // there is to look at.
  ns = Math.min(ns, view.boxes.length <= 14 ? 1.75 : 1.1);
  const fitsW = w * ns <= VW - pad * 2;
  const fitsH = h * ns <= VH - pad * 2;
  return [fitsW ? (VW - w * ns) / 2 : pad,
          (fitsH ? (VH - h * ns) / 2 : pad) + HEAD * ns, ns];
}
function fit(animate = true) {
  const [a, b, c] = fitParams();
  if (animate) moveTo(a, b, c); else { tx = a; ty = b; s = c; draw(); }
}

let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(frame); }
function frame() { raf = 0; if (anim) anim(); render(); if (anim) draw(); }

function render() {
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, VW, VH);
  ctx.translate(tx, ty);
  ctx.scale(s, s);

  const m = 260;
  const x0 = -tx / s - m, y0 = -ty / s - m, x1 = (VW - tx) / s + m, y1 = (VH - ty) / s + m;
  // Paint order matters more than any of the drawing does.
  //
  // Edges used to be drawn first and every container fill painted straight
  // over them, so a line into an open folder vanished at its border and the
  // graph looked disconnected exactly where it was most connected. Wells
  // first, then edges, then the boxes, and finally the selected chain on top
  // of everything so it is never occluded.
  drawWells(x0, y0, x1, y1);
  if (s > 0.2 || selected) drawEdges(x0, y0, x1, y1, s > 0.28);
  // Under the boxes, not over them. Edges were moved on top when folders were
  // drawn as containers, because a line into an open folder vanished at its
  // border. Nothing nests any more, so the only thing painting last achieves
  // is drawing lines across the labels — which is what it was doing.
  if (selected) drawChain(s > 0.28);
  drawBoxes(x0, y0, x1, y1);
  drawLayerHeads();
  drawDenseNote();
  ctx.restore();
  drawMini();
}

// Number the columns.
//
// The left-to-right order is the whole point of the picture and nothing said
// so. Column 1 is what nothing imports — the entry points — and each column
// after it is one import further in, so "how deep is this file" becomes
// something you can read off the axis instead of infer.
// A withheld picture has to announce itself, or it reads as an empty one.
function drawDenseNote() {
  if (!view.dense || selected) return;
  ctx.font = '12.5px "Geist", ui-sans-serif, sans-serif';
  ctx.fillStyle = C.inkFaint;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(view.edges.length + ' connections here — click a file to see its own',
               0, -12);
  ctx.textBaseline = 'middle';
}

function drawLayerHeads() {
  const L = view.layers || [];
  if (!L.length || s < 0.16) return;
  const y = -34;
  ctx.textBaseline = 'alphabetic';

  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    ctx.fillStyle = C.ruleStrong;
    ctx.globalAlpha = 1;
    ctx.fillRect(l.x, y + 9, l.w, Math.max(1, 1 / s));
    ctx.globalAlpha = 1;

    ctx.font = '550 14px "Geist", ui-sans-serif, sans-serif';
    ctx.fillStyle = C.accent;
    const num = String(i + 1);
    ctx.fillText(num, l.x, y);

    if (s > 0.42) {
      ctx.font = '12px "Geist", ui-sans-serif, sans-serif';
      ctx.fillStyle = C.inkFaint;
      const caption = i === 0 ? 'nothing imports these'
        : i === L.length - 1 ? 'imported, imports nothing here'
        : 'imported by column ' + i;
      ctx.fillText(l.n + (l.n === 1 ? ' item  ·  ' : ' items  ·  ') + caption,
                   l.x + ctx.measureText(num).width + 12, y);
    }
  }
  ctx.textBaseline = 'middle';
}

function anchor(x) {
  // Edges attach to a box's right and left middles; for an open container that
  // is its header, which reads as "everything inside this".
  const h = isOpen(x) ? HEADER : x.bh;
  return { l: [x.x, x.y + h / 2], r: [x.x + x.bw, x.y + h / 2] };
}

function drawEdges(x0, y0, x1, y1, curved) {
  const idx = view.index;
  const hot = [];
  const buckets = [[], [], []];
  for (const e of view.edges) {
    const a = idx.get(e.from), b = idx.get(e.to);
    if (!a || !b) continue;
    // An edge touching the selection is never culled. Culling it produced the
    // worst bug in the view: select a node the camera happens not to be
    // looking at and all ten of its connections vanish, leaving only unrelated
    // context lines — the graph appearing to show nothing connected to the one
    // thing you asked about.
    const touches = selected && (e.from === selected || e.to === selected);
    // On a dense level the background lines are withheld entirely — see
    // EDGE_LIMIT. What the selection touches is still drawn, which is the
    // only thing that was legible there anyway.
    if (view.dense && !touches && !(selected && hotSet.has(e.from) && hotSet.has(e.to))) continue;
    if (!touches) {
      if (Math.max(a.x + a.bw, b.x + b.bw) < x0 || Math.min(a.x, b.x) > x1) continue;
      if (Math.max(a.y + a.bh, b.y + b.bh) < y0 || Math.min(a.y, b.y) > y1) continue;
    }
    if (selected && hotSet.has(e.from) && hotSet.has(e.to)) {
      // Collected, not drawn: the chain is painted after the boxes.
      // Which side of the selection an edge sits on decides its colour.
      const dir = (e.to === selected || upSet.has(e.to)) && e.from !== selected && !downSet.has(e.from) ? 'in'
        : (e.from === selected || downSet.has(e.from)) ? 'out'
        : (upSet.has(e.from) ? 'in' : 'out');
      // Direct neighbours are the answer; the rest of the reachable set is
      // context. Ninety-eight equally-weighted lines is the same wall of
      // spaghetti the grouping was meant to remove.
      const direct = e.from === selected || e.to === selected;
      // One hop. Folder aggregation collapses distance — a folder box sits one
      // hop from every file inside it — so allowing two reached 206 lines on a
      // node with 10 real connections. What is left is the ego network: the
      // selection, its neighbours, and how those neighbours relate to each
      // other. The full reachable set still shades the boxes.
      const far = Math.max(hops.get(e.from) ?? 99, hops.get(e.to) ?? 99);
      if (!direct && far > HOP_LIMIT) continue;
      hot.push([a, b, dir, direct]);
      continue;
    }
    buckets[e.n >= view.wt[1] ? 2 : e.n >= view.wt[0] ? 1 : 0].push([a, b]);
  }

  ctx.strokeStyle = C.edge;
  ctx.globalAlpha = selected ? 0.12 : 0.38;
  const widths = [1, 1.9, 3.2];
  for (let i = 0; i < 3; i++) {
    if (!buckets[i].length) continue;
    ctx.lineWidth = widths[i] / s;
    ctx.beginPath();
    for (const [a, b] of buckets[i]) edgePath(a, b, curved);
    ctx.stroke();
  }
  chain = hot;
  ctx.globalAlpha = 1;
}

let chain = [];

// The selected node's relationships, on top of everything and with arrowheads.
// Without a head, a line between two boxes says they are related but not which
// way round, which is the only thing the reader is asking.
function drawChain(curved) {
  for (const dir of ['in', 'out']) {
    const col = dir === 'in' ? C.in : C.out;

    // Everything further out: thin and quiet, so the shape of the blast radius
    // is still visible without competing with the answer.
    const far = chain.filter(h => h[2] === dir && !h[3]);
    if (far.length) {
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1 / s;
      ctx.beginPath();
      for (const [a, b] of far) edgePath(a, b, curved);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // One hop from the selection: full weight, with a head.
    const near = chain.filter(h => h[2] === dir && h[3]);
    if (!near.length) continue;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.4 / s;
    ctx.beginPath();
    for (const [a, b] of near) edgePath(a, b, curved);
    ctx.stroke();
    ctx.fillStyle = col;
    for (const [a, b] of near) arrowHead(a, b);
  }
}

// A small triangle just outside the target's left edge.
function arrowHead(a, b) {
  const e = edgeEnds(a, b);
  const [x, y] = e.to;
  const h = 5 / s, w = (7 / s) * e.dir;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - w, y - h);
  ctx.lineTo(x - w, y + h);
  ctx.closePath();
  ctx.fill();
}

// Which side of each box an edge leaves and arrives on.
//
// This used to be right-to-left always. Most edges run left to right, so most
// of the time that was correct — but an edge pointing backwards then started
// at the far right of the canvas and swept all the way left, crossing every
// box and every label in between to reach a target that was sitting a few
// pixels away. Backward edges leave the left side and arrive on the right,
// which makes them short.
function edgeEnds(a, b) {
  const A = anchor(a), B = anchor(b);
  const ac = a.x + a.bw / 2, bc = b.x + b.bw / 2;

  // Two boxes in the same column. This is not a corner case: modules that
  // depend on each other cannot be ordered, so they all rank the same and land
  // in one column — excalidraw's common, element, excalidraw and math are a
  // four-way cycle sitting side by side. Treating them as a normal edge sent
  // every line out of one box's right edge and back in through another's left,
  // across all four labels.
  //
  // They leave and arrive on the same side and bow outward, the way a sibling
  // connector is drawn, so the line stays clear of every box.
  if (Math.abs(ac - bc) < Math.max(a.bw, b.bw) * 0.5) {
    return { from: A.r, to: B.r, dir: -1, side: true };
  }

  const back = bc < ac;
  return back ? { from: A.l, to: B.r, dir: -1 } : { from: A.r, to: B.l, dir: 1 };
}

function edgePath(a, b, curved) {
  const e = edgeEnds(a, b);
  const [ax, ay] = e.from, [bx, by] = e.to;
  ctx.moveTo(ax, ay);
  if (e.side) {
    // Out to the right and back, clearing the column. How far out is set by
    // how far apart the two boxes are vertically, so parallel sibling edges
    // nest instead of overlapping.
    const bow = Math.max(28 / s, Math.abs(by - ay) * 0.55);
    ctx.bezierCurveTo(ax + bow, ay, bx + bow, by, bx, by);
  } else if (curved) {
    // Bow the control points out past the ends so a backward edge reads as a
    // returning curve rather than a straight line laid over the boxes.
    const span = Math.max(Math.abs(bx - ax) * 0.5, 26 / s);
    ctx.bezierCurveTo(ax + e.dir * span, ay, bx - e.dir * span, by, bx, by);
  } else ctx.lineTo(bx, by);
}

// The recessed background of every open container, drawn before any edge.
function drawWells(x0, y0, x1, y1) {
  for (const x of view.boxes) {
    if (!isOpen(x)) continue;
    if (x.x + x.bw < x0 || x.x > x1 || x.y + x.bh < y0 || x.y > y1) continue;
    ctx.fillStyle = C.paper;
    ctx.beginPath();
    ctx.roundRect(x.x, x.y, x.bw, x.bh, 10);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = C.surface2;
    ctx.fillRect(x.x, x.y, x.bw, HEADER);
    ctx.restore();
  }
}

function drawBoxes(x0, y0, x1, y1) {
  ctx.font = '12px "Geist Mono", ui-monospace, Menlo, monospace';
  ctx.textBaseline = 'middle';
  const showText = s > 0.3;

  for (const x of view.boxes) {
    if (x.x + x.bw < x0 || x.x > x1 || x.y + x.bh < y0 || x.y > y1) continue;

    const open = isOpen(x);
    // The well is already painted; a container only needs its frame and label.
    const dim = (selected && !hotSet.has(x.id) && !open) ||
                (filter && !x.label.toLowerCase().includes(filter));
    ctx.globalAlpha = dim ? 0.12 : 1;
    const isSel = x.id === selected, isHover = x.id === hovered;

    // Container: a light well with a title bar, so its contents read as inside.
    ctx.fillStyle = x.group ? C.surface2
      : x.kind === 'package' ? C.pkgSoft : isSel ? C.accentSoft : C.surface;
    // Entry points get a marker, not a coloured outline. Outlining them turned
    // most of a repo blue, which is the same as marking nothing.
    ctx.strokeStyle = isSel || isHover ? C.accent : x.dead ? C.crit
      : x.kind === 'package' ? C.pkg : C.ruleStrong;

    // Rounded to the site's small radius; a 1px hairline at any zoom.
    ctx.beginPath();
    ctx.roundRect(x.x, x.y, x.bw, x.bh, open ? 10 : 6);
    if (!open) ctx.fill();
    if (x.dead && !x.group) ctx.setLineDash([4 / s, 3 / s]);
    ctx.lineWidth = (isSel ? 2.4 : isHover ? 1.8 : open ? 1.4 : x.group ? 1.3 : 1) / s;
    ctx.stroke();
    ctx.setLineDash([]);

    if (open) {
      ctx.strokeStyle = C.rule;
      ctx.lineWidth = 1 / s;
      ctx.beginPath();
      ctx.moveTo(x.x, x.y + HEADER); ctx.lineTo(x.x + x.bw, x.y + HEADER);
      ctx.stroke();
    }

    // A short accent rule on the leading edge: present when you look for it,
    // silent when you are not.
    if (x.entry && !open) {
      ctx.fillStyle = C.accent;
      ctx.beginPath();
      ctx.roundRect(x.x + 1.5, x.y + 5, 2.5, x.bh - 10, 2);
      ctx.fill();
    }

    if (showText) {
      if (x.text === undefined) layoutText(x);
      const cy = x.y + (open ? HEADER : x.bh) / 2;
      ctx.fillStyle = open ? C.inkSoft : C.ink;
      ctx.fillText(open ? '▾ ' + x.base : x.base, x.x + (x.entry && !open ? 12 : 9), cy);
      if (x.group) {
        ctx.fillStyle = C.inkFaint;
        const c = String(x.count);
        ctx.fillText(c, x.x + x.bw - 9 - ctx.measureText(c).width, cy);
      } else if (x.text) {
        ctx.fillStyle = C.inkFaint;
        ctx.fillText(x.text, x.x + x.textX, cy);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function layoutText(x) {
  ctx.font = '12px "Geist Mono", ui-monospace, Menlo, monospace';
  const label = isOpen(x) ? '▾ ' + x.base : x.base;
  const bw = ctx.measureText(label).width;
  x.textX = 9 + bw + 7;
  const room = x.bw - 9 - x.textX - (x.group ? 36 : 0);
  const dir = dirSuffix(x);
  if (!dir || room < 22 || isOpen(x)) { x.text = ''; return; }
  if (ctx.measureText(dir).width <= room) { x.text = dir; return; }
  let lo = 0, hi = dir.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (ctx.measureText('…' + dir.slice(mid)).width <= room) hi = mid; else lo = mid + 1;
  }
  x.text = lo >= dir.length ? '' : '…' + dir.slice(lo);
}

function drawMini() {
  // Scoping means the graph usually fits, and a minimap of something already
  // fully visible is 198x124 pixels of stage spent saying nothing.
  const off = view.width * s > VW + 4 || view.height * s > VH + 4;
  mini.style.display = off ? 'block' : 'none';
  if (!off) return;
  const w = mini.width / dpr, h = mini.height / dpr;
  mctx.save();
  mctx.scale(dpr, dpr);
  mctx.fillStyle = C.surface;
  mctx.fillRect(0, 0, w, h);
  const gw = Math.max(view.width, 1), gh = Math.max(view.height, 1);
  const k = Math.min(w / gw, h / gh) * 0.9;
  const ox = (w - gw * k) / 2, oy = (h - gh * k) / 2;
  mctx.fillStyle = C.rule;
  for (const x of view.boxes) {
    if (isOpen(x)) continue;
    mctx.fillRect(ox + x.x * k, oy + x.y * k, Math.max(1, x.bw * k), Math.max(1, x.bh * k));
  }
  mctx.strokeStyle = C.accent;
  mctx.lineWidth = 1;
  mctx.strokeRect(ox + (-tx / s) * k, oy + (-ty / s) * k, (VW / s) * k, (VH / s) * k);
  mctx.restore();
}

// ── interaction ─────────────────────────────────────────────────────────────
function worldAt(cx, cy) {
  const r = stage.getBoundingClientRect();
  return [(cx - r.left - tx) / s, (cy - r.top - ty) / s];
}

// Innermost box wins, except that an open container's title bar belongs to the
// container itself — that is how it is closed again.
function boxAt(wx, wy) {
  let best = null;
  for (const x of view.boxes) {
    if (wx < x.x || wx > x.x + x.bw || wy < x.y || wy > x.y + x.bh) continue;
    if (isOpen(x) && wy <= x.y + HEADER) return { box: x, header: true };
    if (!best || x.bw * x.bh < best.bw * best.bh) best = x;
  }
  return best ? { box: best, header: false } : null;
}

// How far the pointer may travel and still count as a click.
//
// This was two pixels, measured between consecutive mousemove events rather
// than from where the button went down. A hand on a trackpad drifts three or
// four pixels during an ordinary click, so the press was read as a pan and
// swallowed: clicking a box did nothing, and did nothing in a way no test
// caught, because synthetic events are pixel-perfect and real ones never are.
const DRAG_SLOP = 6;
let dragging = false, moved = false, lx = 0, ly = 0, downX = 0, downY = 0;
stage.addEventListener('mousedown', e => {
  dragging = true; moved = false;
  lx = downX = e.clientX; ly = downY = e.clientY;
  stage.classList.add('drag');
});
addEventListener('mouseup', () => { dragging = false; stage.classList.remove('drag'); });
addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - lx, dy = e.clientY - ly;
    // From the press, not from the last event: a slow drag never trips a
    // per-event threshold, and a quick click always does.
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > DRAG_SLOP) moved = true;
    anim = null; tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; draw();
    return;
  }
  const hit = boxAt(...worldAt(e.clientX, e.clientY));
  const id = hit ? hit.box.id : null;
  if (id !== hovered) { hovered = id; stage.style.cursor = id ? 'pointer' : ''; draw(); }
});

stage.addEventListener('click', e => {
  if (moved) return;
  const hit = boxAt(...worldAt(e.clientX, e.clientY));
  if (!hit) { select(null); return; }
  // A click tells you about the thing. Going inside it is a second gesture —
  // double-click, or the button in the panel. Descending on a single click
  // meant a folder could never be asked what it was: the only thing clicking
  // one did was replace the screen.
  select(hit.box.id);
});

stage.addEventListener('dblclick', e => {
  const hit = boxAt(...worldAt(e.clientX, e.clientY));
  if (hit && hit.box.group) descend(hit.box);
});

stage.addEventListener('wheel', e => {
  e.preventDefault();
  anim = null;
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.max(0.03, Math.min(3, s * Math.exp(-e.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (ns / s); ty = my - (my - ty) * (ns / s); s = ns;
  draw();
}, { passive: false });

mini.addEventListener('click', e => {
  e.stopPropagation();
  const r = mini.getBoundingClientRect();
  const gw = Math.max(view.width, 1), gh = Math.max(view.height, 1);
  const k = Math.min(r.width / gw, r.height / gh) * 0.9;
  const ox = (r.width - gw * k) / 2, oy = (r.height - gh * k) / 2;
  moveTo(VW / 2 - ((e.clientX - r.left - ox) / k) * s,
         VH / 2 - ((e.clientY - r.top - oy) / k) * s, s, 260);
});

// Opening a folder keeps it under the cursor and eases into the new layout, so
// the picture does not jump out from under the click that caused it.
// things this one pulls in. Drawn in different colours, because "who depends on
// me" and "what do I depend on" are opposite questions and a single highlight
// answers neither clearly.
let upSet = null, downSet = null;
let hops = new Map();
const HOP_LIMIT = 1;

function relations(id) {
  const inc = new Map(), outm = new Map();
  for (const e of view.edges) {
    (inc.get(e.to) || inc.set(e.to, []).get(e.to)).push(e.from);
    (outm.get(e.from) || outm.set(e.from, []).get(e.from)).push(e.to);
  }
  // Distance from the selection, so the drawing can fade the halo by how far
  // away a thing is. The full reachable set still shades the boxes — that is
  // the blast radius, and it is worth seeing — but drawing every one of its
  // edges is what produced the hairball. Lines stop at HOP_LIMIT.
  hops = new Map([[id, 0]]);
  const walk = (start, adj) => {
    const seen = new Set(); const q = [[start, 0]];
    while (q.length) {
      const [cur, d] = q.shift();
      for (const n of (adj.get(cur) || [])) {
        if (seen.has(n)) continue;
        seen.add(n);
        if (!hops.has(n) || hops.get(n) > d + 1) hops.set(n, d + 1);
        q.push([n, d + 1]);
      }
    }
    return seen;
  };
  upSet = walk(id, inc);
  downSet = walk(id, outm);
  return new Set([id, ...upSet, ...downSet]);
}

function select(id, frame = false) {
  selected = id;
  hotSet = id ? relations(id) : null;
  if (!id) { upSet = downSet = null; }
  renderPanel(id ? view.index.get(id) : null);
  if (id && frame) frameSelection(id);
  renderRails();
  draw();
}

// Put the selection and everything one hop from it on screen together.
//
// "How is this connected" cannot be answered by a picture that does not contain
// the things it is connected to, and after a fit on a wide graph the camera is
// at the far left while the node you picked may be four thousand pixels away.
function frameSelection(id) {
  const me = view.index.get(id);
  if (!me) return;

  let l = me.x, t = me.y, r = me.x + me.bw, b = me.y + me.bh;
  let n = 0;
  for (const e of view.edges) {
    const other = e.from === id ? e.to : e.to === id ? e.from : null;
    if (!other) continue;
    const o = view.index.get(other);
    if (!o) continue;
    n++;
    l = Math.min(l, o.x); t = Math.min(t, o.y);
    r = Math.max(r, o.x + o.bw); b = Math.max(b, o.y + o.bh);
  }

  const pad = 70;
  const w = r - l + pad * 2, h = b - t + pad * 2;

  // Readability wins over completeness. A central file's neighbours can span
  // the entire layout, and fitting all of them put the whole graph on screen at
  // 0.22 — every label a grey smudge, which answers nothing. Below this floor,
  // frame the selection itself and let the edges run off-screen: they point the
  // right way, and the panel names every one of them with its import line.
  const FLOOR = 0.75;
  let ns = Math.min(VW / w, VH / h, 1.1);

  let cx = (l + r) / 2, cy = (t + b) / 2;
  if (n === 0 || ns < FLOOR) {
    ns = Math.max(ns, FLOOR);
    // Bias toward the selection rather than the neighbour cloud's centre,
    // keeping a little of the surroundings on the side the neighbours are on.
    const mx = me.x + me.bw / 2, my = me.y + me.bh / 2;
    cx = mx + Math.max(-VW / 3 / ns, Math.min(VW / 3 / ns, cx - mx));
    cy = my + Math.max(-VH / 3 / ns, Math.min(VH / 3 / ns, cy - my));
  }

  moveTo(VW / 2 - cx * ns, VH / 2 - cy * ns, ns, 380);
}

// ── panel helpers ───────────────────────────────────────────────────────────
function esc(x) { return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function bytes(b) {
  if (!b) return null;
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + ' ' + u[i];
}

// ── navigation ──────────────────────────────────────────────────────────────

function navigate(segs, keepSelection) {
  focus = segs.slice();
  // A selection from the previous scope leaves hotSet full of ids that have no
  // box here, and drawBoxes dims everything not in hotSet — the entire new
  // scope would render at alpha 0.12.
  if (!keepSelection) { selected = null; hotSet = null; upSet = downSet = null; renderPanel(null); }
  relayout();
  fit(true);
}

function descend(box) {
  if (!box || !box.group) return;
  navigate(box.segs);
}

function goHome() { navigate([]); }

// Bring an arbitrary node on screen and select it.
//
// The panel lists a file's real imports, and under scoping most of those live
// outside the current scope. Without this every panel link is a dead end: the
// selection would be set to an id with no box, and the panel would blank.
function navigateTo(nodeId) {
  const x = item(nodeId);
  if (!x) return;
  if (x.group) { navigate(x.segs); return; }
  const parent = x.segs.slice(0, -1);
  if (parent.join('/') !== focus.join('/')) navigate(parent, true);
  select(nodeId, true);
}

function renderCrumbs() {
  const bar = document.getElementById('chips');
  // Always rendered, even at the root. Toggling it between none and flex
  // changes the height of the stage, and nothing re-sizes the canvas when it
  // does, so the drawing surface goes stale until the next window resize.
  bar.style.display = 'flex';
  const parts = [`<button class="crumb" data-up="0">${esc(repoName())}</button>`];
  for (let i = 0; i < focus.length; i++) {
    parts.push('<span class="sep">/</span>');
    parts.push(`<button class="crumb" data-up="${i + 1}">${esc(focus[i])}</button>`);
  }
  const f = focusItem();
  bar.innerHTML = parts.join('') +
    `<span class="crumb-count">${f ? f.count + ' files' : files.length + ' files'}</span>`;
  for (const el of bar.querySelectorAll('[data-up]')) {
    el.onclick = () => navigate(focus.slice(0, +el.getAttribute('data-up')));
  }
}

function repoName() {
  const r = (DATA.root || '').replace(/\/+$/, '');
  return r.slice(r.lastIndexOf('/') + 1) || 'repo';
}

// Rails are DOM, not canvas: they are chrome rather than content, they must
// not scale with the zoom, and a scope can be imported by more modules than
// fit on screen, which needs scrolling.
function renderRails() {
  for (const side of ['in', 'out']) {
    const el = document.getElementById('rail-' + side);
    if (!el) continue;
    const list = view.rails ? view.rails[side] : [];
    const sel = selected && view.cross ? view.cross.get(selected) : null;
    const hot = sel ? sel[side] : null;
    const title = side === 'in' ? 'imported by' : 'imports';
    if (!list.length) {
      el.innerHTML = `<h4>${title}</h4><p class="rail-none">nothing crosses here</p>`;
      continue;
    }
    el.innerHTML = `<h4>${title}</h4>` + list.slice(0, 14).map(r => {
      const dim = hot && !hot.has(r.id) ? ' dim' : '';
      const on = hot && hot.has(r.id) ? ' hot' : '';
      return `<button class="rail-item ${side}${dim}${on}" data-rail="${esc(r.id)}">` +
             `<span class="rl">${esc(r.label)}</span><span class="rn">${r.n}</span></button>`;
    }).join('') +
      (list.length > 14 ? `<p class="rail-none">+${list.length - 14} more</p>` : '');
    for (const b of el.querySelectorAll('[data-rail]')) {
      b.onclick = () => navigateTo(b.getAttribute('data-rail'));
    }
  }
}

function goTo(id) {
  const t = view.index.get(id);
  if (!t) return;
  const ns = Math.max(s, 0.55);
  moveTo(VW / 2 - (t.x + t.bw / 2) * ns, VH / 2 - (t.y + t.bh / 2) * ns, ns);
}

// What a folder actually is.
//
// This used to be its name, its path, a file count and a button. Clicking a
// box was the main thing anyone did with the picture and it told them almost
// nothing, which is the difference between a diagram and a tool.
//
// Everything here is derived from the edges rather than stored: which parts
// outside this folder it depends on, which depend on it, and which files
// inside carry the weight.
function folderFacts(x) {
  // Membership by the same rule the layout uses, not by path prefix. A
  // synthetic module has no path to prefix-match against, so the prefix
  // version quietly reported that nothing was inside it.
  const inside = id => childOf(id) === x.id;
  const out = new Map(), inc = new Map();
  let internal = 0;
  const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
  const away = id => {
    const c = childOf(id);
    if (c && c !== x.id) return c;
    const r = railRep(id);
    return r ? r.id : moduleIdOf(id);
  };
  for (const e of DATA.edges) {
    const a = inside(e.from), b = inside(e.to);
    if (a && b) internal++;
    else if (a) bump(out, away(e.to));
    else if (b) bump(inc, away(e.from));
  }
  const shape = m => [...m.entries()]
    .map(([id, n]) => { const t = item(id);
      return { id, n, label: t ? (t.moduleName || t.base || t.label) : id.replace(/^g:/, '') }; })
    .sort((a, b) => b.n - a.n).slice(0, 8);

  // Every file beneath the folder, not only its direct children. A package's
  // files are almost always a level or two down in src/, so the direct-leaf
  // version of this listed whatever stray .d.ts sat at the top and called it
  // the heaviest thing in there.
  const kids = files.filter(n => inside(n.id))
    .sort((a, b) => b.blast - a.blast).slice(0, 6);
  return { out: shape(out), inc: shape(inc), internal, heavy: kids };
}

function renderFolder(panel, x) {
  const f = folderFacts(x);
  // Parts covers every workspace package; modules only the dozen at the top,
  // which the reader is usually already past.
  const mod = (DATA.parts && DATA.parts[x.id])
           || (DATA.modules || []).find(m => m.id === x.id);
  const dead = x.deadCount || 0;

  const list = (title, rows, cls) => {
    if (!rows.length) return '';
    return `<h3><span class="k ${cls}"></span>${title}</h3><ul>` +
      rows.map(r => `<li data-go="${esc(r.id)}">${esc(r.label)}` +
                    `<span class="d"> ${r.n}</span></li>`).join('') + `</ul>`;
  };

  panel.innerHTML =
    `<div class="kind">${esc(mod && mod.kind === 'workspace' ? 'package' : 'folder')}</div>` +
    `<h2>${esc(mod ? mod.name : x.base)}</h2>` +
    `<div class="dir">${esc(x.label || x.dir)}</div>` +
    (mod && mod.desc ? `<div class="note">${esc(mod.desc)}</div>` : '') +
    `<div class="row"><span>files inside</span><span>${x.count}</span></div>` +
    `<div class="row"><span>imports between them</span><span>${f.internal}</span></div>` +
    (mod && mod.entry ? `<div class="row"><span>entered through</span><span>${esc(mod.entry.split('/').pop())}</span></div>` : '') +
    (dead ? `<div class="row"><span>nothing reaches</span><span>${dead}</span></div>` : '') +
    (x.synthetic ? '' : `<button class="chip" id="openg">go inside →</button>`) +
    list('depends on', f.out, 'out') +
    list('depended on by', f.inc, 'in') +
    (f.heavy.length
      ? `<h3>heaviest files here</h3><ul>` +
        f.heavy.map(k => `<li data-go="${esc(k.id)}">${esc(k.base)}` +
                         `<span class="d"> ${k.blast}</span></li>`).join('') + `</ul>`
      : '');

  const go = document.getElementById('openg');
  if (go) go.onclick = () => descend(x);
  wire(panel);
}

function renderPanel(x) {
  const panel = document.getElementById('panel');
  if (!x) {
    const closed = view.boxes.slice();
    const top = closed.slice().sort((a, b) => b.blast - a.blast).slice(0, 10);
    panel.innerHTML =
      `<p class="empty"><b>${closed.length} boxes · ${files.length} files</b>` +
      `Click a folder to go inside it, the breadcrumb above to come back. Click a file for its dependencies.</p>` +
      `<h3>heaviest here</h3><ul>` +
      top.map(t => `<li data-go="${esc(t.id)}">${esc(t.base)}<span class="d"> ${t.group ? t.count + ' files' : t.blast}</span></li>`).join('') +
      `</ul>`;
    wire(panel); return;
  }

  // Synthetic boxes — the repository-root files, the merged tail, external
  // packages — are containers too. Falling through to the file branch gave
  // them a panel with a kind of "group" and no facts at all, which is what
  // clicking one looked like: nothing.
  if (x.group || x.synthetic) { renderFolder(panel, x); return; }

  // Aggregated edges lose the line they came from, so the raw edges are used
  // here: this panel is about specific statements, not bundles.
  const deps = [], dependents = [];
  for (const e of DATA.edges) {
    if (e.from === x.id) deps.push({ ...e, srcPath: x.label });
    if (e.to === x.id) {
      const f = byId.get(e.from);
      dependents.push({ ...e, srcPath: f ? f.label : '' });
    }
  }
  let html = `<div class="kind">${esc(x.kind)}</div><h2>${esc(x.base)}</h2>`;
  if (x.dir) html += `<div class="dir">${esc(x.dir)}</div>`;
  html += `<div class="row"><span>${DATA.exactBlast ? 'breaks if changed' : 'imported by (direct)'}</span><span>${x.blast}</span></div>`;
  html += `<div class="row"><span>imports</span><span>${deps.length}</span></div>`;
  html += `<div class="row"><span>imported by</span><span>${dependents.length}</span></div>`;
  const size = bytes(x.bytes);
  if (size) html += `<div class="row"><span>installed size</span><span>${size}</span></div>`;
  if (x.note) html += `<div class="note${x.dead ? ' bad' : ''}">${esc(x.note)}</div>`;

  // The import lines themselves, not just the names. A name says two files are
  // connected; the line says what the connection is, which is what someone
  // opened the panel to find out.
  const list = (title, es, key, dir) => {
    if (!es.length) return '';
    return `<h3><i class="k ${dir}"></i>${title} (${es.length})</h3>` +
      es.slice(0, 60).map(e => {
        // The other end is often inside a folder that is still closed, so it
        // has no box. Fall back to the file itself rather than printing a raw
        // node id at the reader.
        const t = view.index.get(e[key]) || byId.get(e[key]) || groups.get(e[key]);
        const who = t ? `<span class="d">${esc(t.dir || '')}</span>${esc(t.base)}` : esc(e[key].replace(/^[a-z]+:/, ''));
        const ln = e.line ? `<span class="ln">:${e.line}</span>` : '';
        const code = e.text ? `<code>${esc(e.text)}</code>` : '';
        return `<div class="imp ${dir}" data-go="${esc(e[key])}"` +
          (e.srcPath ? ` data-src="${esc(e.srcPath)}" data-line="${e.line || 0}"` : '') +
          `>${ln}<span class="who">${who}</span>${code}</div>`;
      }).join('');
  };
  html += list('imported by', dependents, 'from', 'in');
  html += list('imports', deps, 'to', 'out');
  if (!DATA.exported) {
    html += `<button class="chip" id="viewsrc" style="margin-top:14px">view source</button>`;
  }
  panel.innerHTML = html;
  wire(panel);
  const vs = document.getElementById('viewsrc');
  if (vs) vs.onclick = () => showSource(x.label, 0);
}

function wire(panel) {
  for (const el of panel.querySelectorAll('[data-go]')) {
    el.onclick = ev => {
      // Clicking the code opens it at that line; clicking the name navigates.
      const src = el.getAttribute('data-src');
      if (src && ev.target.tagName === 'CODE' && !DATA.exported) {
        showSource(src, +el.getAttribute('data-line') || 0);
        return;
      }
      const id = el.getAttribute('data-go');
      const t = view.index.get(id);
      navigateTo(id);
    };
  }
}

// ── source view ─────────────────────────────────────────────────────────────
// Served only by `cairn serve`; the exported single file has no server, and
// falls back to the import lines already in the payload.
const codeEl = document.getElementById('code');
document.getElementById('codeclose').onclick = () => codeEl.classList.remove('on');

async function showSource(path, line) {
  if (!path) return;
  document.getElementById('codepath').textContent = path;
  const body = document.getElementById('codebody');
  body.innerHTML = '<p class="empty" style="padding:12px 16px">loading…</p>';
  codeEl.classList.add('on');

  let text;
  try {
    const r = await fetch('/source?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error(await r.text());
    text = await r.text();
  } catch (err) {
    body.innerHTML = `<p class="empty" style="padding:12px 16px">could not read this file<br><br>${esc(String(err.message || err))}</p>`;
    return;
  }

  // Every line this file imports on, so they can be marked in the margin.
  const hits = new Set();
  for (const e of DATA.edges) {
    const f = byId.get(e.from);
    if (f && f.label === path && e.line) hits.add(e.line);
  }

  const lines = text.split('\n');
  const rows = lines.map((t, i) => {
    const n = i + 1;
    const cls = n === line ? 'here' : hits.has(n) ? 'hit' : '';
    return `<tr class="${cls}" id="L${n}"><td class="n">${n}</td><td>${esc(t) || ' '}</td></tr>`;
  }).join('');
  body.innerHTML = `<table>${rows}</table>`;

  const target = document.getElementById('L' + (line || [...hits][0] || 1));
  if (target) target.scrollIntoView({ block: 'center' });
}

// ── boot ────────────────────────────────────────────────────────────────────
//
// The counts that used to sit in the header — cycles, unreachable — moved to
// the report, where each one can say which and what it costs instead of only
// how many.
document.getElementById('hint').textContent = DATA.truncated
  ? `${DATA.truncated} nodes not sent · f fit · c reset`
  : 'click for details · double-click a folder to go in · / to search';

// Light by default, matching the site; the choice sticks per browser.
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('cairn-theme', t); } catch (e) {}
  readColors();
  for (const x of view.boxes) x.text = undefined;
  draw();
}
let theme = 'light';
try { theme = localStorage.getItem('cairn-theme') || 'light'; } catch (e) {}
document.documentElement.setAttribute('data-theme', theme);
document.getElementById('theme').onclick = () =>
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

// ── report ──────────────────────────────────────────────────────────────────
//
// The header used to carry "cycles 5 · unreachable 14". A count is not a
// finding: it says something is wrong without saying what, where, or whether
// it matters. Every row here names the thing and what it costs, and clicking
// one goes and looks at it.

const R = DATA.report || {};

function findingRow(f, cls) {
  const n = f.n ? `<span class="fn">${f.n}</span>` : '';
  const go = f.go ? ` data-find="${esc(f.go)}"` : '';
  return `<button class="f ${cls || ''}"${go}>${n}` +
         `<span class="ft">${esc(f.title)}</span>` +
         `<span class="fd">${esc(f.detail)}</span></button>`;
}

function section(title, sub, list, cls, empty) {
  let h = `<h2>${esc(title)}</h2>`;
  if (sub) h += `<p class="sub">${esc(sub)}</p>`;
  if (!list || !list.length) return h + `<p class="none">${esc(empty)}</p>`;
  return h + list.map(f => findingRow(f, cls)).join('');
}

function renderReport() {
  const st = DATA.stats || {};
  const mods = (DATA.modules || []).length;
  const body = document.getElementById('rpbody');

  const entryList = (R.entries || []).slice(0, 10)
    .map(e => `<button class="f" data-find="file:${esc(e.file)}">` +
              `<span class="ft">${esc(e.file)}</span>` +
              `<span class="fd">${esc(e.reason)}</span></button>`).join('');

  body.innerHTML =
    `<h1>${esc(repoName())}</h1>` +
    `<p class="lede">${st.files} files, ${st.imports} imports, in ${mods} ` +
    `${mods === 1 ? 'part' : 'parts'}. Everything below was read out of the code itself — ` +
    `nothing here was configured.</p>` +

    `<div class="num">` +
      `<div><b>${st.files}</b><span>files</span></div>` +
      `<div><b>${st.imports}</b><span>imports</span></div>` +
      `<div><b>${mods}</b><span>modules</span></div>` +
      `<div><b>${st.unresolved}</b><span>unresolved</span></div>` +
      `<div><b>${(R.entries || []).length}</b><span>entry points</span></div>` +
    `</div>` +

    section('Import loops',
      'A loop between two files is often deliberate. A loop between two modules means the ' +
      'boundary between them is not real.',
      R.cycles, 'crit', 'None. Every import points one way.') +

    section('Reaching past the front door',
      'A module that publishes an entry point is saying come in this way. These imports go ' +
      'around it, so they break when that module is reorganised.',
      R.boundary, 'warn', 'None. Every cross-module import goes through a declared entry point.') +

    section('Nothing reaches these',
      R.entryBail
        ? 'Not analysed: ' + R.entryBail
        : 'Unreachable from any entry point. Dynamic imports are invisible to this, so check ' +
          'before deleting anything.',
      R.unreachable, '', R.entryBail ? '' : 'Nothing. Every file is reachable.') +

    section('Where a change is felt furthest',
      'Ranked by how many files sit downstream. Entry points are left out — a large reach ' +
      'there is the shape of a program, not a finding about it.',
      R.heavy, '', 'Nothing depends on anything else here.') +

    section('Could not be resolved',
      'Grouped by cause. Almost none of these are mistakes: test fixtures asserting that an ' +
      'import fails, scaffolding templates, generated trees that are not present.',
      R.unresolvedBy, '', 'Every import resolved to a file, a package or a builtin.') +

    `<h2>Entry points</h2>` +
    `<p class="sub">Where the outside world comes in, and how each was recognised. ` +
    `Everything unreachable from one of these is reported above.</p>` +
    (entryList || `<p class="none">None found.</p>`);

  for (const b of body.querySelectorAll('[data-find]')) {
    b.onclick = () => { showTab('graph'); navigateTo(b.getAttribute('data-find')); };
  }
}

function showTab(which) {
  document.body.classList.toggle('report', which === 'report');
  // ── search ──────────────────────────────────────────────────────────────────
//
// The box in the header had never been wired to anything. It set a variable
// that dimmed non-matching boxes and no handler ever assigned it, so the one
// control that looks like it should answer "where is this file" did nothing
// at all.
//
// Scoping makes it matter more than it used to: a file is only on screen when
// the reader is standing in its directory, and finding it by clicking down
// four levels is not finding it. Typing a name searches every file in the
// repository and going to one takes you to where it lives.
const qEl = document.getElementById('q');
let hits = [];

function runSearch() {
  filter = qEl.value.trim().toLowerCase();
  if (!filter) { hits = []; renderPanel(selected ? view.index.get(selected) : null); draw(); return; }

  hits = files
    .filter(n => n.label.toLowerCase().includes(filter))
    .sort((a, b) => b.blast - a.blast)
    .slice(0, 40);

  const panel = document.getElementById('panel');
  panel.innerHTML =
    `<div class="kind">search</div><h2>${esc(qEl.value.trim())}</h2>` +
    `<div class="dir">${hits.length}${hits.length === 40 ? '+' : ''} of ${files.length} files</div>` +
    (hits.length
      ? `<h3>go to</h3><ul>` + hits.map(n =>
          `<li data-go="${esc(n.id)}"><span class="d">${esc(n.dir)}</span>${esc(n.base)}` +
          `<span class="d"> ${n.blast}</span></li>`).join('') + `</ul>`
      : `<p class="empty">Nothing matches.</p>`);
  wire(panel);
  draw();
}

qEl.addEventListener('input', runSearch);
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { qEl.value = ''; runSearch(); qEl.blur(); }
  if (e.key === 'Enter' && hits.length) { navigateTo(hits[0].id); }
});
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
});

for (const t of document.querySelectorAll('.tab')) {
    t.classList.toggle('on', t.getAttribute('data-tab') === which);
  }
  if (which === 'graph') { resize(); draw(); }
}

qEl.addEventListener('input', runSearch);

addEventListener('keydown', e => {

});

for (const t of document.querySelectorAll('.tab')) {
  t.onclick = () => showTab(t.getAttribute('data-tab'));
}

readColors();
addEventListener('resize', resize);

relayout();
focus = openingFocus();
relayout();
resize();
fit(false);
renderPanel(null);
renderReport();
</script>
</body>
